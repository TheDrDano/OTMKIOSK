name: Build Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version"
        required: true
        default: "7.0.0"
      allow_unsigned:
        description: "Allow unsigned installer artifact"
        required: true
        default: "true"
  push:
    branches:
      - main
      - master

jobs:
  build-installer:
    runs-on: windows-2025
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Restore signing certificate
        shell: pwsh
        env:
          OTM_SIGN_PFX_BASE64: ${{ secrets.OTM_SIGN_PFX_BASE64 }}
          ALLOW_UNSIGNED: ${{ github.event.inputs.allow_unsigned || 'true' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OTM_SIGN_PFX_BASE64)) {
            if ($env:ALLOW_UNSIGNED -eq "true") {
              Write-Host "No signing certificate secret configured. Building unsigned installer because allow_unsigned=true."
              exit 0
            }
            throw "No signing certificate configured. Add OTM_SIGN_PFX_BASE64 and OTM_SIGN_PFX_PASSWORD secrets, or rerun manually with allow_unsigned=true."
          }
          New-Item -ItemType Directory -Force -Path .\artifacts\signing | Out-Null
          [IO.File]::WriteAllBytes(".\artifacts\signing\otm-signing.pfx", [Convert]::FromBase64String($env:OTM_SIGN_PFX_BASE64))

      - name: Build installer
        shell: pwsh
        env:
          OTM_SIGN_PFX_PATH: artifacts\signing\otm-signing.pfx
          OTM_SIGN_PFX_PASSWORD: ${{ secrets.OTM_SIGN_PFX_PASSWORD }}
        run: |
          if (Test-Path $env:OTM_SIGN_PFX_PATH) {
            .\scripts\build-installer.ps1 -Version "${{ github.event.inputs.version || '7.0.0' }}" -Sign
          } else {
            .\scripts\build-installer.ps1 -Version "${{ github.event.inputs.version || '7.0.0' }}"
          }

      - name: Verify signatures
        shell: pwsh
        run: |
          if (Test-Path .\artifacts\signing\otm-signing.pfx) {
            .\scripts\verify-signatures.ps1 -Path .\artifacts\installer -Recurse
          } else {
            Write-Host "Signing was not configured; skipping signature verification."
          }

      - name: Show installer publisher
        shell: pwsh
        run: |
          Get-ChildItem .\artifacts\installer -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature -FilePath $_.FullName
            Write-Host "Installer: $($_.Name)"
            Write-Host "Signature status: $($sig.Status)"
            if ($sig.SignerCertificate) {
              Write-Host "Publisher subject: $($sig.SignerCertificate.Subject)"
              Write-Host "Issuer: $($sig.SignerCertificate.Issuer)"
              Write-Host "Thumbprint: $($sig.SignerCertificate.Thumbprint)"
            } else {
              Write-Host "Publisher subject: <unsigned>"
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OTM-Kiosk-Installer
          path: artifacts/installer/*.exe
