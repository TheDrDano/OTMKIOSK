name: Release Installers

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v"
        required: true
        default: "9.2.0"
      allow_unsigned:
        description: "Allow unsigned release artifacts"
        required: true
        default: "true"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}".Trim()
          } else {
            $version = "${{ github.ref_name }}".Trim()
          }
          if ($version.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Restore signing certificate
        shell: pwsh
        env:
          OTM_SIGN_PFX_BASE64: ${{ secrets.OTM_SIGN_PFX_BASE64 }}
          ALLOW_UNSIGNED: ${{ github.event.inputs.allow_unsigned || 'true' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OTM_SIGN_PFX_BASE64)) {
            if ($env:ALLOW_UNSIGNED -eq "true") {
              Write-Host "No signing certificate secret configured. Building unsigned release because allow_unsigned=true."
              exit 0
            }
            throw "No signing certificate configured. Add OTM_SIGN_PFX_BASE64 and OTM_SIGN_PFX_PASSWORD secrets, or rerun manually with allow_unsigned=true."
          }
          New-Item -ItemType Directory -Force -Path .\artifacts\signing | Out-Null
          [IO.File]::WriteAllBytes(".\artifacts\signing\otm-signing.pfx", [Convert]::FromBase64String($env:OTM_SIGN_PFX_BASE64))

      - name: Build station installer
        shell: pwsh
        env:
          OTM_SIGN_PFX_PATH: artifacts\signing\otm-signing.pfx
          OTM_SIGN_PFX_PASSWORD: ${{ secrets.OTM_SIGN_PFX_PASSWORD }}
        run: |
          if (Test-Path $env:OTM_SIGN_PFX_PATH) {
            .\scripts\build-installer.ps1 -Version "${{ steps.version.outputs.version }}" -Sign
          } else {
            .\scripts\build-installer.ps1 -Version "${{ steps.version.outputs.version }}"
          }

      - name: Create update manifest
        shell: pwsh
        run: |
          $station = Get-ChildItem .\artifacts\installer -Filter OTM-Kiosk-Setup.exe | Select-Object -First 1
          .\scripts\create-update-manifest.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Repository "${{ github.repository }}" `
            -Tag "${{ steps.version.outputs.tag }}" `
            -InstallerPath $station.FullName `
            -OutputPath ".\artifacts\release\update-manifest.json" `
            -ReleaseNotes "SimpleKioskOS ${{ steps.version.outputs.version }} station release. Includes local Launchpad setup, dedicated fullscreen website/app mode, startup shell guard, background app exceptions, and station update download support."

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $title = "SimpleKioskOS ${{ steps.version.outputs.version }}"
          $notes = "SimpleKioskOS ${{ steps.version.outputs.version }} station release. Includes local Launchpad setup, dedicated fullscreen website/app mode, startup shell guard, background app exceptions, and station update download support."
          $files = @(
            (Get-ChildItem .\artifacts\installer -Filter OTM-Kiosk-Setup.exe | Select-Object -First 1).FullName,
            (Resolve-Path .\artifacts\release\update-manifest.json).Path
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title $title --notes $notes
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SimpleKioskOS-Release
          path: |
            artifacts/installer/*.exe
            artifacts/release/update-manifest.json
